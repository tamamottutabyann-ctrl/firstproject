- include_vars: ../vars/grafana_password.yml
- name: Add Grafana APT key
  apt_key:
    url: https://packages.grafana.com/gpg.key
    state: present

- name: Add Grafana repository
  apt_repository:
    repo: "deb https://packages.grafana.com/oss/deb stable main"
    state: present

- name: Install grafana
  apt:
    name: grafana
    state: present


- name: make Grafana service enabled and started
  service:
    name: grafana-server
    state: started
    enabled: yes

- name: Allow all access to tcp port 3000
  ufw:
    rule: allow
    port: '3000'
    proto: tcp

- name: Configure Grafana admin password
  command: >
    grafana-cli admin reset-admin-password {{ grafana_password }}
